<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Customer Book</title>
<meta name="apple-mobile-web-app-title" content="Customer Book">
<meta name="theme-color" content="#0a6cb4">
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#fff;--fg:#0f2437;--mut:#5a6b7b;--blue:#0a6cb4}
@media (prefers-color-scheme:dark){:root{--bg:#0d1620;--fg:#eef3f8;--mut:#9fb0c0}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:16px;box-sizing:border-box}
img{width:120px;height:120px;border-radius:50%}
a{display:inline-block;margin-top:18px;background:var(--blue);color:#fff;text-decoration:none;padding:14px 26px;border-radius:12px;font-weight:600}
p{color:var(--mut);margin:10px 0 0}
</style></head><body><main>
<img src="icon-192.png" alt="TruBlue Phoenix">
<h1 style="margin:14px 0 0;font-size:22px">TruBlue Customer Book</h1>
<div id="save">
<p style="color:var(--fg);font-weight:600;margin-top:16px">Save this page as an app icon:</p>
<p>iPhone (Chrome): tap <b>Share</b> &rarr; <b>Add to Home Screen</b> &rarr; <b>Add</b><br>
Computer (Chrome): <b>&#8942;</b> menu &rarr; <b>Cast, save and share</b> &rarr; <b>Create shortcut</b></p>
</div>
<p id="opening" style="display:none">Opening your Book…</p>
<a id="go" href="#">Open Customer Book</a>
</main>
<script>
// One permanent link for the team. To move everyone to a new Book or app, change BOOK below.
var BOOK="https://claude.ai/artifact/NCarCtzxvkTQnq4Lpmiasv";
document.getElementById('go').href=BOOK;
var q=new URLSearchParams(location.search);
if(q.get('go')==='1'||navigator.standalone||matchMedia('(display-mode: standalone)').matches){
  document.getElementById('save').style.display='none';
  document.getElementById('opening').style.display='block';
  location.replace(BOOK);
}else{
  // The icon people save points at ?go=1, so tapping it opens the Book straight away.
  try{history.replaceState(null,'',location.pathname+'?go=1')}catch(e){}
}
</script>
</body>
</html>
